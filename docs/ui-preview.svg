<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="title desc">
  <title id="title">LAN Vault Bridge conflict review interface preview</title>
  <desc>A design mockup of the Sync review modal with file presence cards, content diff and action buttons.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f7"/>
      <stop offset="1" stop-color="#dfe3ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a2f45" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="980" height="760" fill="url(#page)"/>
  <text x="490" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6072">Interface preview · design mockup, not a screenshot</text>

  <!-- Modal -->
  <rect x="70" y="52" width="840" height="666" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#d8d9e6"/>
  <text x="96" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2333">Sync review</text>
  <text x="96" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6072">Desktop: Windows · this device: Android</text>
  <text x="96" y="130" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#7a8095">By default the plugin preserves data: deleted files are offered for restore, newer versions win.</text>

  <!-- Section 1 -->
  <text x="96" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2333">File presence</text>
  <rect x="240" y="152" width="24" height="18" rx="9" fill="#eceef5"/>
  <text x="252" y="165" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6072">3</text>
  <rect x="470" y="148" width="180" height="26" rx="6" fill="#f1f0ff" stroke="#d8d4ff"/>
  <text x="560" y="165" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#4b3fd1">Apply defaults to all</text>
  <rect x="658" y="148" width="116" height="26" rx="6" fill="#f5f6fa" stroke="#d8d9e6"/>
  <text x="716" y="165" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#3f455a">Accept all</text>
  <rect x="782" y="148" width="104" height="26" rx="6" fill="#f5f6fa" stroke="#d8d9e6"/>
  <text x="834" y="165" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#3f455a">Send all</text>

  <!-- Card 1 -->
  <rect x="96" y="184" width="790" height="74" rx="10" fill="#f4f5fa" stroke="#d8d9e6"/>
  <text x="112" y="210" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#1f2333">Notes/Idea.md</text>
  <rect x="238" y="195" width="118" height="20" rx="10" fill="#fff4e5" stroke="#f0c987"/>
  <text x="297" y="209" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#8a5a00">On phone only</text>
  <text x="112" y="234" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6072">Phone: 1.2 KB · 18.11.2026, 21:40</text>
  <rect x="640" y="214" width="112" height="26" rx="6" fill="#6c5ce7"/>
  <text x="696" y="231" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#ffffff">Send to desktop</text>
  <rect x="758" y="214" width="112" height="26" rx="6" fill="#f5f6fa" stroke="#d8d9e6"/>
  <text x="814" y="231" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#3f455a">Skip</text>

  <!-- Card 2 -->
  <rect x="96" y="266" width="790" height="74" rx="10" fill="#f4f5fa" stroke="#d8d9e6"/>
  <text x="112" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#1f2333">Archive/Old.md</text>
  <rect x="238" y="277" width="132" height="20" rx="10" fill="#ffe8e8" stroke="#f0a6a6"/>
  <text x="304" y="291" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#a12a2a">Deleted on desktop</text>
  <text x="112" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6072">Phone: 4.8 KB · 12.11.2026, 09:15 · Desktop: deleted 17.11.2026</text>
  <rect x="640" y="296" width="140" height="26" rx="6" fill="#6c5ce7"/>
  <text x="710" y="313" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#ffffff">Restore on desktop</text>
  <rect x="786" y="296" width="84" height="26" rx="6" fill="#fff4e5" stroke="#f0c987"/>
  <text x="828" y="313" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#8a5a00">Delete…</text>

  <!-- Section 2 -->
  <text x="96" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2333">Content changes</text>
  <rect x="266" y="366" width="24" height="18" rx="9" fill="#eceef5"/>
  <text x="278" y="379" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#5a6072">1</text>

  <rect x="96" y="398" width="790" height="210" rx="10" fill="#f4f5fa" stroke="#d8d9e6"/>
  <text x="112" y="422" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#1f2333">Projects/Plan.md</text>
  <rect x="258" y="407" width="66" height="20" rx="10" fill="#f1f0ff" stroke="#cfc8ff"/>
  <text x="291" y="421" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#4b3fd1">Changed</text>
  <text x="112" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a8095">added on phone · removed on phone (exists on desktop)</text>

  <rect x="112" y="452" width="758" height="112" rx="8" fill="#ffffff" stroke="#e2e4ee"/>
  <text x="124" y="474" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#3f455a"># Plan</text>
  <text x="124" y="494" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#3f455a">- Ship </text>
  <rect x="160" y="484" width="88" height="14" rx="3" fill="#ffe1e1"/>
  <text x="164" y="494" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#8c1d1d">v1 in June</text>
  <rect x="250" y="484" width="144" height="14" rx="3" fill="#d9f6e6"/>
  <text x="254" y="494" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#0b6b47">v2 in December</text>
  <text x="124" y="514" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#3f455a">- Update docs</text>
  <text x="124" y="534" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#3f455a">- Add screenshots</text>

  <rect x="640" y="548" width="112" height="26" rx="6" fill="#6c5ce7"/>
  <text x="696" y="565" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#ffffff">Send phone ver.</text>
  <rect x="758" y="548" width="112" height="26" rx="6" fill="#f5f6fa" stroke="#d8d9e6"/>
  <text x="814" y="565" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#3f455a">Accept desktop</text>

  <!-- Footer -->
  <line x1="96" y1="636" x2="886" y2="636" stroke="#e2e4ee"/>
  <text x="96" y="668" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6072">Remaining conflicts: 4</text>
  <rect x="770" y="648" width="116" height="32" rx="6" fill="#6c5ce7"/>
  <text x="828" y="669" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#ffffff">Close</text>
  <text x="490" y="740" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#7a8095">Built with Obsidian CSS variables; colors adapt to light and dark themes.</text>
</svg>
